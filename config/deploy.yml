service: egot-tracker
image: kquizz/egot-tracker

servers:
  web:
    hosts:
      - 192.168.50.220

proxy:
  ssl: false   # Cloudflare terminates HTTPS; the tunnel speaks plain HTTP to us
  host: egot.kquizz.com   # add this route in the Cloudflare tunnel dashboard

registry:
  server: ghcr.io
  username: kquizz
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    SOLID_QUEUE_IN_PUMA: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f

volumes:
  - "egot_tracker_storage:/rails/storage"   # SQLite (cache) persistence

asset_path: /rails/public/assets

builder:
  arch: amd64

ssh:
  user: kquizz
